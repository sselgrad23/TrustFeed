[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustfeed"
version = "0.1.0"
description = "Turn long-form foreign-language news audio into review-ready social clips"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "soundfile>=0.12",
    "mlflow>=2.10",
]

[project.optional-dependencies]
# The local extraction LLM. Kept optional so the base install (and CI) stay light
# and torch-free - the heuristic backend and ASR need none of it.
llm = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
# Offline evaluation (FLEURS download + WER).
eval = ["datasets>=2.18", "jiwer>=3.0"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
