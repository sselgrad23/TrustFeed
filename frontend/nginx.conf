# Serves the static React bundle and proxies API calls to the api service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200M;  # media uploads

    # SPA fallback: unknown routes return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api/* to the FastAPI container (strips the /api prefix).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;  # transcription can be slow
    }
}
